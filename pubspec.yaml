name: docuscan
description: Professional document scanner app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7
  flutter_image_compress: ^2.1.0
  google_mlkit_text_recognition: ^0.11.0
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^7.2.1
  open_filex: ^4.3.4
  file_picker: ^6.1.1
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  google_sign_in: ^6.1.6
  http: ^1.1.2
  permission_handler: ^11.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  photo_view: ^0.14.0
  reorderables: ^0.6.0
  flutter_staggered_grid_view: ^0.7.0
  signature: ^5.4.0
  uuid: ^4.2.2
  intl: ^0.18.1
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
